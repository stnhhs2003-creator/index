<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>🙏 保你平安 - 團購即時點單系統</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --success: #10b981;
            --success-hover: #059669;
            --danger: #ef4444;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --border: #cbd5e1;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #0f172a;
            background-image: radial-gradient(at 50% 0%, #1e1b4b 0px, transparent 75%);
            color: var(--text-main);
            min-height: 100vh;
            padding: 16px 10px;
        }

        .app-container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 24px 20px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 2px dashed #e2e8f0;
        }

        .header h1 {
            font-size: 1.6rem;
            font-weight: 900;
            color: #1e3a8a;
            margin-bottom: 6px;
        }

        .header p {
            font-size: 0.9rem;
            color: #64748b;
            font-weight: 700;
        }

        .section-card {
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            padding: 18px 16px;
            margin-bottom: 20px;
        }

        .section-card-title {
            font-size: 1.15rem;
            font-weight: 900;
            color: #0284c7;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .form-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
            min-width: 140px;
        }

        .form-group label {
            font-size: 0.85rem;
            font-weight: 800;
            color: #475569;
        }

        .form-input {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid var(--border);
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 800;
            color: #0f172a;
            outline: none;
            background: #ffffff;
        }

        .form-input:focus {
            border-color: var(--primary);
        }

        .products-grid {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .product-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #ffffff;
            border: 2px solid #38bdf8;
            padding: 6px 12px;
            border-radius: 10px;
        }

        .product-pill input[type="text"] {
            width: 80px;
            font-size: 0.95rem;
            font-weight: 800;
            text-align: center;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            padding: 4px;
        }

        .product-pill input[type="number"] {
            width: 60px;
            font-size: 0.95rem;
            font-weight: 800;
            text-align: center;
            color: #0284c7;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            padding: 4px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 10px 16px;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 800;
            border: none;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-success { background: var(--success); color: white; }
        .btn-success:hover { background: var(--success-hover); }
        .btn-danger { background: var(--danger); color: white; }
        .btn-sm { padding: 5px 10px; font-size: 0.82rem; }

        .table-container {
            overflow-x: auto;
            border: 2px solid #cbd5e1;
            border-radius: 14px;
            background: white;
            margin-bottom: 16px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            min-width: 500px;
        }

        th, td {
            padding: 12px 8px;
            border-bottom: 1px solid #e2e8f0;
            font-size: 0.95rem;
        }

        th {
            background: #f1f5f9;
            color: #334155;
            font-weight: 800;
        }

        .input-name {
            width: 110px;
            padding: 8px;
            border: 2px solid #0284c7;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 800;
            text-align: center;
            color: #0f172a;
            background: #ffffff;
        }

        .input-qty {
            width: 55px;
            padding: 8px 4px;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 900;
            text-align: center;
            color: #0284c7;
        }

        .input-qty.has-val {
            background: #e0f2fe;
            border-color: #38bdf8;
        }

        .summary-bar {
            background: #1e293b;
            color: white;
            border-radius: 14px;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        .modal-box {
            background: white;
            border-radius: 16px;
            padding: 24px;
            max-width: 500px;
            width: 92%;
        }

        .modal-box textarea {
            width: 100%;
            height: 250px;
            padding: 12px;
            border: 2px solid #cbd5e1;
            border-radius: 10px;
            font-family: monospace;
            font-size: 0.9rem;
            resize: vertical;
            margin-top: 10px;
            outline: none;
        }

        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #0f172a;
            color: white;
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: 800;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            z-index: 9999;
        }
    </style>
</head>
<body>

<div id="toast" class="toast" style="display: none;"></div>

<div class="app-container">
    <div class="header">
        <h1>🙏 保你平安 - 團購即時點單系統</h1>
        <p>1. 設定商品 ➔ 2. 填寫訂單 ➔ 3. 複製連結給好友 (即時帶入資料)</p>
    </div>

    <!-- 步驟 1：團購主題與商品單價設定 -->
    <div class="section-card">
        <div class="section-card-title">
            <span>第一步：設定團購主題與商品品項</span>
            <div style="display: flex; gap: 8px;">
                <button class="btn btn-danger btn-sm" onclick="startNewGroupConfirm()">🚀 建立全新開團 (清空舊資料)</button>
                <button class="btn btn-primary btn-sm" onclick="addProduct()">➕ 新增商品</button>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group" style="flex: 2;">
                <label>🏷️ 團購主題 (例：8/20 水果團)</label>
                <input type="text" id="groupTitle" class="form-input" placeholder="請輸入團購主題" oninput="saveAndSync()">
            </div>
            <div class="form-group">
                <label>👤 團主姓名</label>
                <input type="text" id="groupHost" class="form-input" placeholder="團主名稱" oninput="saveAndSync()">
            </div>
        </div>

        <div style="font-size: 0.85rem; font-weight: 800; color: #475569; margin-top: 8px;">📦 開放商品品項與單價：</div>
        <div class="products-grid" id="productsGrid"></div>
    </div>

    <!-- 步驟 2：填寫點單 -->
    <div class="section-card">
        <div class="section-card-title">
            <span>第二步：成員點單與數量</span>
            <div style="display: flex; gap: 8px;">
                <button class="btn btn-success btn-sm" onclick="copyShareLink()">🔗 複製共用連結發給好友</button>
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr id="tableHeader">
                        <th>姓名</th>
                        <th>個人小計</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
            <button class="btn btn-primary" onclick="addMember()">➕ 新增點單人員</button>
            <button class="btn btn-danger btn-sm" onclick="clearAllData()">🧹 清空重新開始</button>
        </div>
    </div>

    <!-- 步驟 3：結算總計與輸出明細 -->
    <div class="summary-bar">
        <div>
            <div style="font-size: 0.85rem; color: #94a3b8; font-weight: 800;">📦 各商品訂購需求件數：</div>
            <div id="qtySummaryText" style="font-size: 1rem; font-weight: 800; color: #38bdf8; margin-top: 2px;">尚未點單</div>
        </div>
        <div style="display: flex; align-items: center; gap: 16px;">
            <div>
                <div style="font-size: 0.8rem; color: #94a3b8; text-align: right;">團購營業總額</div>
                <div id="grandTotalText" style="font-size: 1.5rem; font-weight: 900; color: #fbbf24;">$0</div>
            </div>
            <button class="btn btn-success" onclick="exportTextSummary()">📤 一鍵輸出結算文字</button>
        </div>
    </div>
</div>

<!-- 結算文字 Modal -->
<div class="modal-overlay" id="exportModal" onclick="if(event.target === this) closeModal()">
    <div class="modal-box">
        <h3 style="color: #0f172a; font-weight: 900;">📋 團購結算文字明細</h3>
        <p style="font-size: 0.85rem; color: #64748b; margin-top: 4px;">已自動複製！可直接發送至 LINE 群組：</p>
        <textarea id="exportTextarea" readonly></textarea>
        <div style="margin-top: 16px; display: flex; justify-content: flex-end; gap: 10px;">
            <button class="btn btn-primary" onclick="copyModalText()">再次複製文字</button>
            <button class="btn btn-danger" onclick="closeModal()">關閉</button>
        </div>
    </div>
</div>

<script>
    var products = ['品項1', '品項2'];
    var prices = { '品項1': 100, '品項2': 100 };
    var members = [];

    window.renderUI = function() {
        renderProducts();
        renderTable();
        calculate();
    };

    function renderProducts() {
        const grid = document.getElementById('productsGrid');
        if (!grid) return;
        grid.innerHTML = '';
        products.forEach((p, idx) => {
            const pill = document.createElement('div');
            pill.className = 'product-pill';
            pill.innerHTML = `
                <input type="text" value="${p}" oninput="updateProductNameLive(${idx}, this.value)" placeholder="品項名稱">
                <span style="font-weight:800; color:#059669;">$</span>
                <input type="number" value="${prices[p] !== undefined ? prices[p] : 0}" oninput="updateProductPriceLive('${p}', this.value)" placeholder="價格">
                <button onclick="removeProduct(${idx})" style="border:none; background:none; color:#ef4444; font-weight:900; cursor:pointer;">✕</button>
            `;
            grid.appendChild(pill);
        });
    }

    window.updateProductNameLive = function(idx, val) {
        const oldP = products[idx];
        const newP = val.trim();
        if (!newP) return;
        products[idx] = newP;
        if (prices[oldP] !== undefined) {
            prices[newP] = prices[oldP];
            delete prices[oldP];
        } else {
            prices[newP] = 100;
        }

        members.forEach(m => {
            if (m.qtys && m.qtys[oldP] !== undefined) {
                m.qtys[newP] = m.qtys[oldP];
                delete m.qtys[oldP];
            }
        });
        renderTable();
        calculate();
        saveAndSync();
    };

    window.updateProductPriceLive = function(p, val) {
        prices[p] = parseInt(val) || 0;
        calculate();
        saveAndSync();
    };

    window.addProduct = function() {
        const nextNum = products.length + 1;
        const newP = '品項' + nextNum;
        products.push(newP);
        prices[newP] = 100;
        members.forEach(m => {
            if (!m.qtys) m.qtys = {};
            m.qtys[newP] = 0;
        });
        renderUI();
        saveAndSync();
    };

    window.removeProduct = function(idx) {
        if (products.length <= 1) {
            showToast('至少需保留一個品項！');
            return;
        }
        const p = products[idx];
        products.splice(idx, 1);
        delete prices[p];
        members.forEach(m => {
            if (m.qtys) delete m.qtys[p];
        });
        renderUI();
        saveAndSync();
    };

    function renderTable() {
        const header = document.getElementById('tableHeader');
        let hHtml = `<th>姓名</th>`;
        products.forEach(p => {
            hHtml += `<th>${p}<br><span style="font-size:0.75rem; color:#0284c7;">$${prices[p] || 0}</span></th>`;
        });
        hHtml += `<th>小計</th><th>操作</th>`;
        header.innerHTML = hHtml;

        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';

        if (members.length === 0) {
            tbody.innerHTML = `<tr><td colspan="${products.length + 3}" style="padding:20px; color:#94a3b8;">目前尚無成員點單，請點擊下方「➕ 新增點單人員」按鈕！</td></tr>`;
            return;
        }

        members.forEach(m => {
            let trHtml = `<td><input type="text" class="input-name" value="${m.name || ''}" oninput="updateMemberName('${m.id}', this.value)" placeholder="名字"></td>`;
            products.forEach(p => {
                const q = (m.qtys && m.qtys[p]) ? m.qtys[p] : 0;
                const hasVal = q > 0 ? 'has-val' : '';
                trHtml += `<td><input type="number" min="0" class="input-qty ${hasVal}" value="${q}" oninput="updateMemberQty('${m.id}', '${p}', this)"></td>`;
            });
            trHtml += `<td style="font-weight:900; color:#2563eb;" id="subtotal-${m.id}">$0</td>`;
            trHtml += `<td><button class="btn btn-danger btn-sm" onclick="removeMember('${m.id}')">✕</button></td>`;

            const tr = document.createElement('tr');
            tr.innerHTML = trHtml;
            tbody.appendChild(tr);
        });
    }

    window.updateMemberName = function(id, val) {
        const m = members.find(x => x.id === id);
        if (m) {
            m.name = val;
            saveAndSync();
        }
    };

    window.updateMemberQty = function(id, p, inputEl) {
        const m = members.find(x => x.id === id);
        if (m) {
            const val = parseInt(inputEl.value) || 0;
            if (!m.qtys) m.qtys = {};
            m.qtys[p] = val;
            if (val > 0) inputEl.classList.add('has-val');
            else inputEl.classList.remove('has-val');
            calculate();
            saveAndSync();
        }
    };

    window.addMember = function() {
        let qtys = {};
        products.forEach(p => qtys[p] = 0);
        members.push({ id: Math.random().toString(36).substr(2, 9), name: '成員', qtys });
        renderUI();
        saveAndSync();
    };

    window.removeMember = function(id) {
        const idx = members.findIndex(x => x.id === id);
        if (idx !== -1) {
            members.splice(idx, 1);
            renderUI();
            saveAndSync();
        }
    };

    function calculate() {
        let pTotals = {};
        products.forEach(p => pTotals[p] = 0);
        let grandTotal = 0;

        members.forEach(m => {
            let rowSum = 0;
            products.forEach(p => {
                const q = (m.qtys && m.qtys[p]) ? m.qtys[p] : 0;
                const price = prices[p] || 0;
                rowSum += q * price;
                pTotals[p] += q;
            });
            grandTotal += rowSum;
            const subEl = document.getElementById('subtotal-' + m.id);
            if (subEl) subEl.innerText = '$' + rowSum.toLocaleString();
        });

        document.getElementById('grandTotalText').innerText = '$' + grandTotal.toLocaleString();

        const qSummaryEl = document.getElementById('qtySummaryText');
        if (products.length === 0) {
            qSummaryEl.innerText = '無品項';
        } else {
            qSummaryEl.innerHTML = products.map(p => `${p}: <b style="color:#fbbf24;">${pTotals[p] || 0}</b> 件`).join(' | ');
        }
    }

    function startNewGroupConfirm() {
        if (confirm('⚠️ 確定要建立全新的開團嗎？\n這將會清空畫面上的舊團名、商品與所有成員點單！')) {
            products = ['品項1', '品項2'];
            prices = { '品項1': 100, '品項2': 100 };
            members = [];
            document.getElementById('groupTitle').value = '';
            document.getElementById('groupHost').value = '';
            renderUI();
            
            // 清空網址 Hash
            try {
                const baseUrl = window.location.origin + window.location.pathname;
                window.history.replaceState({ path: baseUrl }, '', baseUrl);
            } catch(e) {}
            
            showToast('🚀 已重置畫面！您可以開始輸入新團名與商品囉！');
        }
    }

    function clearAllData() {
        startNewGroupConfirm();
    }

    function saveAndSync() {
        const payload = {
            title: document.getElementById('groupTitle') ? document.getElementById('groupTitle').value : '',
            host: document.getElementById('groupHost') ? document.getElementById('groupHost').value : '',
            products: products,
            prices: prices,
            members: members
        };

        try {
            const jsonStr = JSON.stringify(payload);
            const packed = btoa(unescape(encodeURIComponent(jsonStr)));
            
            // 1. 自動把最新點單資料儲存在瀏覽器網址列與 LocalStorage
            localStorage.setItem('baonipingan_latest_payload', jsonStr);

            let baseUrl = window.location.origin + window.location.pathname;
            if (!baseUrl.endsWith('index.html') && !baseUrl.endsWith('/')) {
                baseUrl += '/index.html';
            } else if (baseUrl.endsWith('/')) {
                baseUrl += 'index.html';
            }
            const newUrl = baseUrl + '?d=' + packed;
            window.history.replaceState({ path: newUrl }, '', newUrl);
        } catch(e) {}
    }

    function copyShareLink() {
        saveAndSync();
        const payload = {
            title: document.getElementById('groupTitle').value,
            host: document.getElementById('groupHost').value,
            products: products,
            prices: prices,
            members: members
        };

        const titleText = document.getElementById('groupTitle').value.trim() || '團購';
        const jsonStr = JSON.stringify(payload);
        const packed = btoa(unescape(encodeURIComponent(jsonStr)));
        let baseUrl = window.location.origin + window.location.pathname;
        if (!baseUrl.endsWith('index.html') && !baseUrl.endsWith('/')) {
            baseUrl += '/index.html';
        } else if (baseUrl.endsWith('/')) {
            baseUrl += 'index.html';
        }
        const shareUrl = `${baseUrl}?d=${packed}`;

        // 整理適合直接發到 LINE 的對話框文字 (乾淨 URL 確保 LINE 100% 可點擊)
        const lineText = `🛒 【${titleText}】點單邀請連結\n👉 點擊開啟即可填寫或查看點單：\n${shareUrl}`;

        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(lineText).then(() => {
                showToast('🔗 LINE 點單邀請連結已複製！貼到 LINE 聊天室發送即可！');
            }).catch(() => fallbackCopy(lineText));
        } else {
            fallbackCopy(lineText);
        }
    }

    function fallbackCopy(text) {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.select();
        try {
            document.execCommand('copy');
            showToast('🔗 已複製即時共用連結！');
        } catch(e) {}
        document.body.removeChild(textarea);
    }

    function exportTextSummary() {
        const title = document.getElementById('groupTitle').value.trim() || '團購單';
        const host = document.getElementById('groupHost').value.trim() || '團主';

        let text = `📋 【${title}】結算明細\n`;
        text += `👤 團主：${host}\n`;
        text += `----------------------------------\n`;
        text += `📦 商品單價：\n`;
        products.forEach(p => {
            text += `• ${p}: $${prices[p] || 0}\n`;
        });
        text += `----------------------------------\n`;
        text += `👥 成員點單明細 (共 ${members.length} 人)：\n\n`;

        let grandTotal = 0;
        let pTotals = {};
        products.forEach(p => pTotals[p] = 0);

        members.forEach((m, idx) => {
            let itemParts = [];
            let rowSum = 0;
            products.forEach(p => {
                const q = (m.qtys && m.qtys[p]) ? m.qtys[p] : 0;
                if (q > 0) {
                    itemParts.push(`${p}×${q}`);
                    pTotals[p] += q;
                    rowSum += q * (prices[p] || 0);
                }
            });
            if (itemParts.length > 0) {
                grandTotal += rowSum;
                text += `${idx + 1}. ${m.name}: ${itemParts.join(', ')} (小計 $${rowSum.toLocaleString()})\n`;
            }
        });

        text += `----------------------------------\n`;
        text += `📦 商品需求總計：\n`;
        products.forEach(p => {
            const count = pTotals[p] || 0;
            const pSum = count * (prices[p] || 0);
            text += `• ${p}: ${count} 件 ($${pSum.toLocaleString()})\n`;
        });
        text += `----------------------------------\n`;
        text += `💰 團購總金額：$${grandTotal.toLocaleString()}\n`;

        document.getElementById('exportTextarea').value = text;
        document.getElementById('exportModal').style.display = 'flex';

        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).catch(() => {});
        }
    }

    window.copyModalText = function() {
        const textarea = document.getElementById('exportTextarea');
        if (textarea) {
            textarea.select();
            document.execCommand('copy');
        }
        showToast('已複製結算文字到剪貼簿！');
    };

    window.closeModal = function() {
        const modal = document.getElementById('exportModal');
        if (modal) modal.style.display = 'none';
    };

    window.closeExportModal = function() {
        window.closeModal();
    };

    function showToast(msg) {
        const container = document.getElementById('toastContainer');
        let toast = document.getElementById('toast');
        if (!toast) {
            toast = document.createElement('div');
            toast.id = 'toast';
            toast.className = 'toast';
            document.body.appendChild(toast);
        }
        toast.innerText = msg;
        toast.style.display = 'block';
        setTimeout(() => toast.style.display = 'none', 3000);
    }

    function initCloudAndRealtime() {
        var hashData = getHashPayload();
        var queryData = getQueryPayload();
        var targetPayload = hashData || queryData;

        if (targetPayload) {
            applyRemoteData(targetPayload);
        } else {
            renderUI();
        }

        window.addEventListener('hashchange', function() {
            var p = getHashPayload();
            if (p) applyRemoteData(p);
        });
    }

    function getHashPayload() {
        try {
            if (window.location.hash && window.location.hash.indexOf('data=') !== -1) {
                var raw = window.location.hash.split('data=')[1];
                if (raw.indexOf('&') !== -1) raw = raw.split('&')[0];
                return parseB64Data(raw);
            }
        } catch(e) {}
        return null;
    }

    function getQueryPayload() {
        try {
            var urlParams = new URLSearchParams(window.location.search);
            var raw = urlParams.get('d');
            if (raw) return parseB64Data(raw);
        } catch(e) {}
        return null;
    }

    function parseB64Data(rawStr) {
        if (!rawStr) return null;
        try {
            var jsonStr = decodeURIComponent(escape(atob(rawStr)));
            return JSON.parse(jsonStr);
        } catch(e) {
            try {
                var jsonStr = decodeURIComponent(atob(rawStr));
                return JSON.parse(jsonStr);
            } catch(err) {
                return null;
            }
        }
    }

    function applyRemoteData(d) {
        if (!d) return;

        if (d.products && Array.isArray(d.products)) products = [].concat(d.products);
        if (d.prices) prices = Object.assign({}, d.prices);
        if (d.members && Array.isArray(d.members)) members = [].concat(d.members);

        if (document.getElementById('groupTitle') && d.title !== undefined) document.getElementById('groupTitle').value = d.title;
        if (document.getElementById('groupHost') && d.host !== undefined) document.getElementById('groupHost').value = d.host;

        if (typeof renderUI === 'function') renderUI();
    }

    function exportTextSummary() {
        const title = document.getElementById('groupTitle') ? document.getElementById('groupTitle').value.trim() : '團購單';
        const host = document.getElementById('groupHost') ? document.getElementById('groupHost').value.trim() : '團主';

        let text = `📋 【${title}】團購結算明細\n`;
        text += `👤 團主：${host}\n`;
        text += `----------------------------------\n`;
        text += `📦 開放商品單價：\n`;
        products.forEach(p => {
            text += `• ${p}: $${prices[p] || 0}\n`;
        });
        text += `----------------------------------\n`;
        text += `👥 個人點單明細 (共 ${members.length} 人)：\n\n`;

        let grandTotal = 0;
        let pTotals = {};
        products.forEach(p => pTotals[p] = 0);

        members.forEach((m, idx) => {
            let itemParts = [];
            let rowSum = 0;
            products.forEach(p => {
                const q = (m.qtys && m.qtys[p]) ? m.qtys[p] : 0;
                if (q > 0) {
                    itemParts.push(`${p}×${q}`);
                    pTotals[p] += q;
                    rowSum += q * (prices[p] || 0);
                }
            });
            grandTotal += rowSum;
            const itemStr = itemParts.length > 0 ? itemParts.join(', ') : '未點單';
            text += `${idx + 1}. ${m.name || '未具名'}: ${itemStr}  ➔  個人小計: $${rowSum.toLocaleString()}\n`;
        });

        text += `----------------------------------\n`;
        text += `📦 商品訂購總件數：\n`;
        products.forEach(p => {
            const count = pTotals[p] || 0;
            const pSum = count * (prices[p] || 0);
            text += `• ${p}: ${count} 件 (金額 $${pSum.toLocaleString()})\n`;
        });
        text += `----------------------------------\n`;
        text += `💰 團購營業總額：$${grandTotal.toLocaleString()}\n`;

        const textarea = document.getElementById('exportTextarea');
        if (textarea) textarea.value = text;
        
        document.getElementById('exportModal').style.display = 'flex';

        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(() => {
                showToast('📋 已自動將個人明細與總結算文字複製到剪貼簿！');
            }).catch(() => {});
        }
    }

    if (document.readyState === 'loading') {
        window.addEventListener('DOMContentLoaded', window.initCloudAndRealtime);
    } else {
        window.initCloudAndRealtime();
    }
</script>
</body>
</html>
